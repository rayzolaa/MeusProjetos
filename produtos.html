<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catalogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Loja de salgados Gensa</h1>
    </header>

    <div class="catalogo">
        <div class="produto">
            <img src="img/cachorro2.jpg" alt="">
            <h2>Cachorro quente</h2>
            <p class="descricao">
                Quentinho e saboroso
            </p>
            <p class="preco">
                R$ 8,00
            </p>
            <div class="produto">
            <img src="img/coxinha.jpg" alt="">
            <h2>Coxinha</h2>
            <p class="descricao">
                um salgado para toda a familia!
            </p>
            <p class="preco">
                R$ 9,00
            </p>
        </div>
        <div class="produto">
            <img src="img/kibe.jpg" alt="">
            <h2>Kibe</h2>
            <p class="descricao">
                um salgado para toda a familia!
            </p>
            <p class="preco">
                R$ 6,00
            </p>
        </div>
    </div>
    
</body>
</html>
